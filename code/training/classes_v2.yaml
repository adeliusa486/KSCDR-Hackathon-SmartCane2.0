# Smart cane - class list v2: 150 classes for US and Gulf streets, sidewalks
# and indoors. Decided 2 Oct 2026 (Adeel): US and Gulf focus plus general
# objects, spoken in English with US terms (sidewalk, curb, crosswalk, trash
# can). Replaces the India-focused classes.yaml list for new training.
#
# Fields
#   name    internal class name, also the label-file name
#   say     what the cane says (US English)
#   group   for reporting and priority
#   danger  high = can injure (vehicles, drops, holes, crossings)
#           medium = collision or trip, low = information or finding things
#   why     the reason the class exists (Phase 3 Step 3.5: every class needs one)
#   src     where boxes come from, as dataset:label. Datasets:
#             coco       COCO 2017 (have it, free)
#             oiv7       Open Images V7 (free, no account, fetch_openimages.py)
#             mapillary  Mapillary Vistas v2 (account), MTSD for sign types
#             roboflow   Roboflow Universe sets (API key)
#             od         Obstacle-Dataset (Google Drive)
#             rdd        RDD2022 road damage (US subset included)
#   confirm true = the source label name or the dataset is not checked yet.
#           It needs the account or download before training.
#   region  true = a surface, not an object (curb, crosswalk, rail track). A
#           detection box fits it badly. Kept for a first model, flagged for
#           a segmentation model or the ground ToF later.
#
# Classes not in this list are still reported: speak_detect.py says
# "obstacle" for anything the model cannot name with confidence.

version: 2
language: en-US
classes:
  # --- people and animals ---------------------------------------------------
  - {name: person, say: person, group: people, danger: high, why: "the most common moving obstacle", src: ["coco:person", "oiv7:Person", "oiv7:Man", "oiv7:Woman", "mapillary:human--person--individual"]}
