<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1640" width="1240" height="1640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Smart cane prototype, exploded view</title>
<rect width="1240" height="1640" fill="#ffffff"/>
<line x1="330" y1="133.6" x2="330" y2="1563.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="30.0" y="40.0" font-size="22" font-weight="700" fill="#111827" text-anchor="start" >Exploded view of the cane unit</text>
<text x="30.0" y="64.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Schematic. Board sizes from manufacturer data, housing and power bank shape representative. Everything shown rides on the cane.</text>
<polygon points="314.8,116.0 384.9,156.5 345.2,179.4 275.1,138.9" fill="#e5e7eb" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="384.9,156.5 384.9,202.4 345.2,225.3 345.2,179.4" fill="#d1d5db" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="275.1,138.9 345.2,179.4 345.2,225.3 275.1,184.8" fill="#9ca3af" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="388.9,156.5 424.9,156.5 640,150.5" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="388.9" cy="156.5" r="3" fill="#6b7280"/>
<text x="650.0" y="155.5" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >1  Grip, 3D-printed</text>
<text x="650.0" y="176.5" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >2 push buttons on top:</text>
<text x="650.0" y="195.5" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Assistant (GPIO33), Read text (GPIO32)</text>
<text x="650.0" y="214.5" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Vibration motor pressed against the inner wall (GPIO13)</text>
<polygon points="289.1,251.3 464.5,352.6 370.9,406.6 195.5,305.3" fill="#f3f4f6" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="464.5,352.6 464.5,363.4 370.9,417.4 370.9,406.6" fill="#e5e7eb" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="195.5,305.3 370.9,406.6 370.9,417.4 195.5,316.1" fill="#d1d5db" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="468.5,352.6 504.5,352.6 640,346.6" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="468.5" cy="352.6" r="3" fill="#6b7280"/>
<text x="650.0" y="351.6" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >2  Housing cover, 3D-printed</text>
<text x="650.0" y="372.6" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Vent slots over the Active Cooler fan</text>
<polygon points="325.0,443.4 401.0,487.3 335.0,525.4 259.0,481.5" fill="#bbf7d0" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="401.0,487.3 401.0,492.7 335.0,530.8 335.0,525.4" fill="#86efac" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="259.0,481.5 335.0,525.4 335.0,530.8 259.0,486.9" fill="#4ade80" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="405.0,487.3 441.0,487.3 640,481.3" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="405.0" cy="487.3" r="3" fill="#6b7280"/>
<text x="650.0" y="486.3" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >3  AI HAT+ (Hailo-8L, 13 TOPS)</text>
<text x="650.0" y="507.3" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >65 x 56.5 mm, PCIe ribbon + 40-pin header</text>
<text x="650.0" y="526.3" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Runs the 152-class detector, ~29 ms per frame</text>
<polygon points="318.3,556.8 400.1,604.1 341.7,637.8 259.9,590.6" fill="#cbd5e1" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="400.1,604.1 400.1,617.6 341.7,651.3 341.7,637.8" fill="#94a3b8" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="259.9,590.6 341.7,637.8 341.7,651.3 259.9,604.1" fill="#64748b" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="404.1,604.1 440.1,604.1 640,598.1" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="404.1" cy="604.1" r="3" fill="#6b7280"/>
<text x="650.0" y="603.1" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >4  Active Cooler</text>
<text x="650.0" y="624.1" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Keeps the Pi 5 from throttling (60 C measured under load)</text>
<polygon points="313.0,677.3 412.4,734.7 347.0,772.5 247.6,715.1" fill="#86efac" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="412.4,734.7 412.4,740.1 347.0,777.9 347.0,772.5" fill="#4ade80" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="247.6,715.1 347.0,772.5 347.0,777.9 247.6,720.5" fill="#22c55e" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="416.4,734.7 452.4,734.7 640,728.7" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="416.4" cy="734.7" r="3" fill="#6b7280"/>
<text x="650.0" y="733.7" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >5  Raspberry Pi 5, 2 GB</text>
<text x="650.0" y="754.7" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >85 x 56 mm. Vision, speech, assistant</text>
<text x="650.0" y="773.7" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >CAM0: camera. USB: ESP32. USB-C: power bank</text>
<polygon points="316.6,803.9 376.2,838.3 343.4,857.2 283.8,822.8" fill="#bfdbfe" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="376.2,838.3 376.2,843.7 343.4,862.6 343.4,857.2" fill="#93c5fd" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="283.8,822.8 343.4,857.2 343.4,862.6 283.8,828.2" fill="#60a5fa" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="380.2,838.3 416.2,838.3 640,832.3" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="380.2" cy="838.3" r="3" fill="#6b7280"/>
<text x="650.0" y="837.3" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >6  ESP32 DevKit V1</text>
<text x="650.0" y="858.3" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >~51 x 28 mm. Safety controller: both ToF sensors,</text>
<text x="650.0" y="877.3" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >motor and buttons. Alerts without the Pi</text>
<polygon points="287.9,888.6 451.6,983.1 372.1,1029.0 208.4,934.5" fill="#fde68a" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="451.6,983.1 451.6,1004.7 372.1,1050.6 372.1,1029.0" fill="#fcd34d" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="208.4,934.5 372.1,1029.0 372.1,1050.6 208.4,956.1" fill="#f59e0b" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="455.6,983.1 491.6,983.1 640,977.1" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="455.6" cy="983.1" r="3" fill="#6b7280"/>
<text x="650.0" y="982.1" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >7  Power bank, 10,000 mAh</text>
<text x="650.0" y="1003.1" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >USB-C to the Pi 5. Needs a steady 5 V at 3 A or more</text>
<text x="650.0" y="1022.1" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >(see docs/power.md). Size varies by model</text>
<polygon points="289.1,1076.6 464.5,1177.9 370.9,1231.9 195.5,1130.6" fill="#f3f4f6" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="464.5,1177.9 464.5,1191.4 370.9,1245.4 370.9,1231.9" fill="#e5e7eb" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="195.5,1130.6 370.9,1231.9 370.9,1245.4 195.5,1144.1" fill="#d1d5db" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="468.5,1177.9 504.5,1177.9 640,1171.9" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="468.5" cy="1177.9" r="3" fill="#6b7280"/>
<text x="650.0" y="1176.9" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >8  Housing base + shaft clamp</text>
<text x="650.0" y="1197.9" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Sensor head at the front end (part 9)</text>
<polygon points="330.0,1271.4 376.8,1298.4 330.0,1325.4 283.2,1298.4" fill="#fecaca" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="376.8,1298.4 376.8,1330.8 330.0,1357.8 330.0,1325.4" fill="#fca5a5" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="283.2,1298.4 330.0,1325.4 330.0,1357.8 283.2,1330.8" fill="#f87171" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="380.8,1298.4 416.8,1298.4 640,1292.4" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="380.8" cy="1298.4" r="3" fill="#6b7280"/>
<text x="650.0" y="1297.4" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >9  Sensor head</text>
<text x="650.0" y="1318.4" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Camera: Arducam B0310, IMX708, 120 deg M12 lens</text>
<text x="650.0" y="1337.4" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >ToF 1 VL53L0X, forward, 55 deg up from the shaft</text>
<text x="650.0" y="1356.4" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >ToF 2 VL53L0X, down, 15 deg forward of the shaft</text>
<polygon points="330.0,1383.8 348.7,1394.6 330.0,1405.4 311.3,1394.6" fill="#374151" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="348.7,1394.6 348.7,1502.6 330.0,1513.4 330.0,1405.4" fill="#1f2937" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/><polygon points="311.3,1394.6 330.0,1405.4 330.0,1513.4 311.3,1502.6" fill="#111827" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="352.7,1394.6 388.7,1394.6 640,1407.4" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="352.7" cy="1394.6" r="3" fill="#6b7280"/>
<text x="650.0" y="1412.4" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >10 Cane shaft, 124-127 cm</text>
<text x="650.0" y="1433.4" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start" >Sensors at 110-115 cm from the tip</text>
<text x="30.0" y="1590.0" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start" >Cables inside the housing: CSI ribbon camera to CAM0, PCIe ribbon HAT to Pi, USB ESP32 to Pi, USB-C power bank to Pi,</text>
<text x="30.0" y="1610.0" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start" >I2C runs ESP32 to each ToF (3V3, GND, SDA, SCL, XSHUT, one bus each), two wires each to the motor and to each button.</text>
</svg>
