<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Smart cane sensor geometry, side view</title>
  <desc>Cane held 40 degrees from vertical. ToF 2 at 110 cm looks down and reaches the ground about 147 cm away, 50 cm past the tip. ToF 1 and the camera at 115 cm look 5 degrees above level. Scale 3 px per cm.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <clipPath id="below-title"><rect x="0" y="82" width="1240" height="600"/></clipPath>
  </defs>
  <rect width="1240" height="680" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#111827">Sensor geometry, side view (walking direction to the right)</text>
  <text x="30" y="64" font-size="14" fill="#4b5563">Cane 127 cm long, held 40° from vertical. Scale 1 cm = 3 px. Heights and distances follow from the mount positions in docs/hardware.md.</text>

  <!-- ground -->
  <line x1="20" y1="560" x2="1220" y2="560" stroke="#374151" stroke-width="3"/>
  <g fill="#9ca3af">
    <path d="M20 560 h1200 v14 h-1200 z" opacity="0.25"/>
  </g>
  <text x="1150" y="590" font-size="14" fill="#374151">ground</text>

  <!-- pothole at the ToF 2 landing point -->
  <path d="M870 560 q20 34 78 34 q50 0 64 -34" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="900" y="618" font-size="14" fill="#111827" text-anchor="middle">pothole / drop</text>

  <!-- camera field of view (vertical, +-33 deg around 5 deg up) -->
  <g clip-path="url(#below-title)">
  <path d="M538 296 L1000 -65 L1220 -65 L1220 560 L1034 560 Z" fill="#3b82f6" opacity="0.07"/>
  <line x1="538" y1="296" x2="1034" y2="560" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="538" y1="296" x2="1000" y2="-65" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="6 5"/>
  </g>
  <text x="905" y="478" font-size="13" fill="#1d4ed8" transform="rotate(28 905 478)">camera view edge (98° x 66°)</text>

  <!-- ToF 1 cone: 5 deg up +-12.5 deg, drawn to 150 cm (450 px) -->
  <path d="M538 296 L986 155 L986 356 Z" fill="#f59e0b" opacity="0.18"/>
  <line x1="538" y1="296" x2="986" y2="257" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="986" y1="155" x2="986" y2="356" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="996" y="172" font-size="13" fill="#92400e">135 cm high</text>
  <text x="996" y="360" font-size="13" fill="#92400e">68 cm high</text>
  <text x="996" y="262" font-size="14" font-weight="700" fill="#92400e">1.5 m</text>

  <!-- ToF 2 beam: 55 deg from vertical, cone +-12.5 deg -->
  <path d="M548 307 L780 560 L1160 560 Z" fill="#ef4444" opacity="0.10"/>
  <line x1="548" y1="307" x2="909" y2="560" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="415" font-size="14" font-weight="700" fill="#991b1b" transform="rotate(35 640 415)">ToF 2 beam, ~147 cm</text>

  <!-- cane -->
  <line x1="515" y1="268" x2="760" y2="560" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
  <line x1="745" y1="542" x2="760" y2="560" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <!-- housing -->
  <g transform="rotate(-40 540 300)">
    <rect x="522" y="250" width="40" height="92" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="2"/>
  </g>
  <!-- sensor dots -->
  <circle cx="538" cy="296" r="6" fill="#d97706" stroke="#111827" stroke-width="1.5"/>
  <circle cx="548" cy="307" r="6" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>

  <!-- user silhouette -->
  <g fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round">
    <circle cx="420" cy="98" r="22"/>
    <line x1="420" y1="120" x2="420" y2="330"/>
    <line x1="420" y1="160" x2="515" y2="268"/>
    <line x1="420" y1="160" x2="380" y2="300"/>
    <line x1="420" y1="330" x2="452" y2="560"/>
    <line x1="420" y1="330" x2="380" y2="560"/>
  </g>
  <rect x="447" y="100" width="16" height="10" rx="3" fill="#6b7280"/>
  <text x="468" y="100" font-size="12" fill="#4b5563">earbuds</text>

  <!-- dimension: tip to landing point -->
  <line x1="760" y1="640" x2="909" y2="640" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="834" y="660" font-size="14" fill="#111827" text-anchor="middle">~50 cm past the tip</text>
  <line x1="760" y1="566" x2="760" y2="646" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="909" y1="566" x2="909" y2="646" stroke="#9ca3af" stroke-dasharray="3 3"/>

  <!-- heights -->

  <!-- callouts -->
  <g font-size="14" fill="#111827">
    <line x1="538" y1="290" x2="300" y2="200" stroke="#d97706" stroke-width="1.2"/>
    <text x="30" y="190" font-weight="700" fill="#92400e">ToF 1 (forward) + camera</text>
    <text x="30" y="210">115 cm up the shaft, 88 cm above ground</text>
    <text x="30" y="228">aimed 55° up from the shaft = 5° above level</text>
    <text x="30" y="246">25° cone never touches the ground</text>

    <line x1="548" y1="313" x2="300" y2="410" stroke="#dc2626" stroke-width="1.2"/>
    <text x="30" y="400" font-weight="700" fill="#991b1b">ToF 2 (down)</text>
    <text x="30" y="420">110 cm up the shaft, 84 cm above ground</text>
    <text x="30" y="438">aimed 15° forward of the shaft line</text>
    <text x="30" y="456">spot ~65 cm across at the ground</text>

    <text x="566" y="392" font-size="13" fill="#374151" transform="rotate(50 566 392)">cane 127 cm, 40° from vertical</text>
  </g>
</svg>
